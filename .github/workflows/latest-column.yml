name: Columnas (portada y editorial)

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días, 6:00 a. m. hora de Bogotá
  workflow_dispatch: {}      # permite ejecutarla a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar columnas en Al Poniente y Medium
        run: python .github/scripts/latest_column.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet -- assets/latest.json assets/columns.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/latest.json assets/columns.json
            git commit -m "Columnas: actualización automática"
            git push
          else
            echo "Sin cambios"
          fi
